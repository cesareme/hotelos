# ehotelOS production stack · Hostinger VPS (or any Docker-capable host)
#
# Brings up Postgres, Redis, the Fastify API, the Vite-built admin SPA, and
# Caddy in front for automatic HTTPS via Let's Encrypt. Designed to be
# rebuildable from scratch on a fresh Ubuntu 24.04 box in under 15 minutes.
#
# Usage:
#   cp deploy/.env.production.example deploy/.env.production
#   nano deploy/.env.production           # fill in real secrets
#   docker compose -f deploy/docker-compose.production.yml --env-file deploy/.env.production up -d
#
# The stack is multi-tenant by default: one API + one Postgres serves every
# client. Tenancy is row-level (organizationId / propertyId), driven by the
# Super-Admin Console (sidebar → Admin & Developer → "Consola de tenants").
#
# Backups: Postgres is dumped nightly via the `postgres-backup` sidecar (see
# below). Redis persists with AOF.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotelos}
      POSTGRES_USER: ${POSTGRES_USER:-hotelos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Tuned for a 16 GB VPS. Bump shared_buffers + work_mem if you upgrade.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=8GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_connections=200
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hotelos} -d ${POSTGRES_DB:-hotelos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence so queue state survives reboots.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Tanda 4 (DATA-04): the WHOLE deploy/.env.production reaches the container
    # through env_file (fiscal certificates and SistemaInformatico block, email
    # provider, APP_BASE_URL, CORS_ALLOWED_ORIGINS, RATE_LIMIT_MAX, RBAC_STRICT,
    # RUN_SCHEDULERS...). `environment:` only carries what the compose computes
    # and it always wins over env_file. HOTELOS_ALLOW_DEMO_AUTH must never be in
    # .env.production: scripts/validate-env.mjs rejects the file (deploy.sh) and
    # the API refuses to boot with it under NODE_ENV=production (AUTH-04).
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      # Container networking: Caddy reaches api:3000, so bind every interface
      # (a native HOST=127.0.0.1 in .env.production must not leak in here).
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-hotelos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hotelos}
      REDIS_URL: redis://redis:6379
      # audit 2026-06 R2 · H2: detras de Caddy hay que confiar en X-Forwarded-For
      # o el rate-limit colapsa todas las peticiones a la IP de Caddy (DoS auto-infligido).
      TRUST_PROXY: "1"
    volumes:
      # Fiscal certificates (VERIFACTU_CERT_P12 / VERIFACTU_SIGN_PEM,
      # SES_HOSPEDAJES_CERT_PATH, TBAI_CERT_PATH, IGIC_CERT_PATH): drop the files
      # in deploy/certs (gitignored, mkdir -p deploy/certs) and reference them as
      # /certs/<file> in .env.production.
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 6
    networks:
      - internal
      - web

  # Worker · jobs pg-boss (verifactu.retry, webhooks.deliver). audit 2026-06 R2 · H1:
  # sin este servicio, una factura que falla el 1er envio a la AEAT se queda en
  # 'retrying' para siempre = incumplimiento fiscal silencioso. Corre los jobs de cola,
  # NO los schedulers in-process (esos van en la api).
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Same contract as the api service: env_file carries the configuration,
    # `environment:` only what the compose computes or forces.
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-hotelos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hotelos}
      REDIS_URL: redis://redis:6379
      # El worker no corre los schedulers in-process (evita duplicar con la api).
      RUN_SCHEDULERS: "false"
    volumes:
      - ./certs:/certs:ro
    networks:
      - internal

  admin-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.admin-web
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-https://demo.ehotelos.com/api}
    restart: unless-stopped
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-demo.ehotelos.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - admin-web
    networks:
      - web

  # Optional: nightly Postgres dumps to ./postgres-backups (kept 14 days).
  # The host-side cron (/etc/cron.d/hotelos-backup, 03:15) that runs this
  # profile is installed by deploy/scripts/bootstrap-vps.sh step 9/9.
  postgres-backup:
    image: postgres:16-alpine
    restart: "no"
    profiles: ["backup"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: >
      sh -c "pg_dump -h postgres -U ${POSTGRES_USER:-hotelos} -d ${POSTGRES_DB:-hotelos} -F c
             -f /backups/dump-$$(date +%Y%m%d_%H%M%S).pgcustom &&
             find /backups -name 'dump-*.pgcustom' -mtime +14 -delete"
    volumes:
      - ./postgres-backups:/backups
    networks:
      - internal

networks:
  internal:
    driver: bridge
  web:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
