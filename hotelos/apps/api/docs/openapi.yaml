          description: "Bad request (renuncia sin motivo; mode / cuerpo no válidos)"
        401:
          description: Unauthorized
        403:
          description: "Forbidden — missing required permission (pms.reservation.modify; folio.charge.post con penalización > 0; pms.reservation.discount al renunciar)"
        404:
          description: Resource not found
        409:
          description: "RESERVATION_NOT_ACTIVE (la reserva no está draft/confirmed) · APPROVAL_REQUIRED (renuncia por encima del tramo operativo: details { kind: discount, tier })"
        429:
          description: Too many requests
        500:
          description: Internal server error
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        description: "Tanda L3 · lote B (corrector ronda 1). Esquema NO strict: una clave desconocida se ignora, nunca 400."
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 1000
                  description: "Motivo (auditoría de la reserva). Obligatorio para renunciar a la penalización (applyPolicy: false con importe > 0 → 400 sin motivo)."
                applyPolicy:
                  type: boolean
                  default: true
                  description: "true (omitido): aplica la política de la reserva (línea cancellation_fee / no_show_fee no sujeta, folio cerrado a saldo 0 si todos sus cargos están facturados). false: renuncia a la penalización — descuento de facto por tramos de §4.7: ≤ T1 (importe ≤ discount.T1 y ≤ discountPctT1 de la estancia) con pms.reservation.discount + motivo; ≤ discountPctT2 con el motor de aprobaciones (solicitud aprobada, override propio o PIN de supervisor); por encima solo solicitud aprobada → 409 APPROVAL_REQUIRED (kind discount) sin efecto alguno."
                supervisorAuthorizationId:
                  type: string
                  description: "Autorización de un solo uso por PIN (POST /rbac/supervisor-authorizations) para pms.reservation.override sobre esta reserva: levanta la renuncia en el tramo de supervisión (no por encima de él)."
