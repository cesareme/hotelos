  /properties/{propertyId}/night-audit/run:
    post:
      summary: "POST /properties/:propertyId/night-audit/run"
      description: "Ejecuta el cierre del día de la fecha de negocio actual (modules/night-audit; manifiesto modules/night-audit/route-permissions.partial.ts). Orden de las guardas: centro no operativo (oficina) → 409 WORK_CENTER_NOT_OPERATIONAL; fecha ya cerrada → 409 NIGHT_AUDIT_ALREADY_COMPLETED; en curso → 409 NIGHT_AUDIT_IN_PROGRESS; después la PUERTA DE PREFLIGHT (Tanda L5 · L5-D): el servicio construye el mismo preflight de GET …/night-audit/preflight (medido sobre la fecha de negocio) y con algún bloqueo responde 409 NIGHT_AUDIT_PREFLIGHT_BLOCKED { businessDate, blockers[{ id, title, count, detail }] } sin escribir nada. Cuerpo opcional { force?: boolean, reasonText?: string (10..1000) }: force + motivo ejecuta el cierre pese a los bloqueos, audita NIGHT_AUDIT_PREFLIGHT_OVERRIDDEN { businessDate, runId, blockers, reasonText } y el informe lleva report.preflightOverride { reasonText, blockers }; force sin motivo → 400 «Indica el motivo para cerrar con bloqueos.»; un preflight sin bloqueos ignora force. Pasos: validate_open_folios, snapshot_room_status, post_room_charges (integrador L5 · INT-L5-01: solo carga las reservas alojadas ESA noche — min(llegada reservada, día de check-in físico en la zona horaria del hotel) ≤ fecha de negocio; las demás cuentan metrics.notYetInHouse y salen como ítems «Aún no alojada esa noche…»), process_no_shows (L3: no-show con política, penalización y folio cerrado a 0), close_settled_folios (nuevo: cierra cada folio abierto de reserva cancelled | no_show | checked_out con saldo 0 y todos los cargos facturados; los saldados sin factura cuentan pendingInvoice y los que conservan saldo withBalance + importe, ambos avisos del informe; idempotente), revenue_snapshot, payments_summary, cash_closures, advance_business_date. Respuesta NightAuditRunWire (packages/shared/src/pos-types.ts) con report.settledFolios { closed, pendingInvoice, withBalance, totalWithBalance } y reviewedByUserId / reviewedAt / reopenedByUserId / reopenedAt / reopenReasonCode."
      operationId: "post-properties-by-propertyid-night-audit-run"
      tags:
      - properties
      x-permissions:
      - night_audit.run
      x-risk-level: high
      x-manifest-entry: true
      responses:
        200:
          description: Successful response
        400:
          description: Bad request
        401:
          description: Unauthorized
        403:
          description: Forbidden — missing required permission
        404:
          description: Resource not found
        409:
          description: Conflict — WORK_CENTER_NOT_OPERATIONAL | NIGHT_AUDIT_ALREADY_COMPLETED | NIGHT_AUDIT_IN_PROGRESS | NIGHT_AUDIT_PREFLIGHT_BLOCKED
        429:
          description: Too many requests
        500:
          description: Internal server error
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                force:
                  type: boolean
                reasonText:
                  type: string
                  minLength: 10
                  maxLength: 1000
